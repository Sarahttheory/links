<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Abstract top-view bento icon</title>
  <desc id="desc">A futuristic abstract bento box seen from above, with neon compartments and chopsticks.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d9ff"/>
      <stop offset=".48" stop-color="#315cff"/>
      <stop offset="1" stop-color="#8c35ff"/>
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25e2ff"/>
      <stop offset=".52" stop-color="#315fff"/>
      <stop offset="1" stop-color="#a437ff"/>
    </linearGradient>
    <linearGradient id="veg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffd9"/>
      <stop offset=".55" stop-color="#31cdbf"/>
      <stop offset="1" stop-color="#2775d7"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff65c7"/>
      <stop offset=".55" stop-color="#c132ff"/>
      <stop offset="1" stop-color="#6e45ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb44b"/>
      <stop offset=".48" stop-color="#ff6b9f"/>
      <stop offset="1" stop-color="#b446ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="88" fill="#06070a"/>

  <!-- outer glow -->
  <rect x="76" y="86" width="360" height="340" rx="64" fill="none" stroke="url(#frame)" stroke-width="18" opacity=".28" filter="url(#soft)"/>

  <!-- tray -->
  <rect x="76" y="86" width="360" height="340" rx="64" fill="#101321" stroke="url(#frame)" stroke-width="14"/>
  <rect x="96" y="106" width="320" height="300" rx="48" fill="#070b18" stroke="#1a2552" stroke-width="3"/>

  <!-- compartments -->
  <rect x="108" y="118" width="138" height="126" rx="28" fill="#0e1634"/>
  <rect x="266" y="118" width="138" height="126" rx="28" fill="#10142e"/>
  <rect x="108" y="258" width="138" height="136" rx="30" fill="#12153b"/>
  <rect x="266" y="258" width="138" height="136" rx="30" fill="#17142f"/>

  <!-- rice-like shapes -->
  <path d="M131 203c-18-38 6-72 52-77 43-5 68 16 63 57-4 33-28 50-67 48-22-1-39-9-48-28z" fill="url(#rice)" filter="url(#glow)"/>
  <path d="M131 368c-10-46 22-87 67-93 44-5 70 18 67 62-3 47-31 67-75 67-32 0-52-12-59-36z" fill="url(#rice)" filter="url(#glow)"/>

  <!-- seeds / accents -->
  <g fill="#d7f2ff" opacity=".9">
    <rect x="153" y="150" width="7" height="19" rx="3.5" transform="rotate(28 153 150)"/>
    <rect x="187" y="135" width="7" height="19" rx="3.5" transform="rotate(-32 187 135)"/>
    <rect x="215" y="175" width="7" height="19" rx="3.5" transform="rotate(35 215 175)"/>
    <rect x="157" y="310" width="7" height="19" rx="3.5" transform="rotate(-25 157 310)"/>
    <rect x="198" y="338" width="7" height="19" rx="3.5" transform="rotate(32 198 338)"/>
    <rect x="222" y="292" width="7" height="19" rx="3.5" transform="rotate(18 222 292)"/>
  </g>

  <!-- leaves -->
  <g filter="url(#glow)">
    <path d="M295 176c-10-35 10-61 43-73 7 34-8 62-43 73z" fill="url(#veg)"/>
    <path d="M321 193c-4-34 16-57 46-64 2 30-13 55-46 64z" fill="url(#veg)"/>
    <path d="M290 213c-6-33 9-55 38-67 5 29-8 55-38 67z" fill="url(#veg)"/>
  </g>

  <!-- pink slices -->
  <g fill="url(#pink)" filter="url(#glow)">
    <circle cx="363" cy="163" r="26"/>
    <circle cx="344" cy="201" r="28"/>
    <circle cx="380" cy="206" r="28"/>
  </g>
  <g fill="#f7a0ff" opacity=".65">
    <circle cx="358" cy="155" r="3"/><circle cx="370" cy="170" r="3"/>
    <circle cx="336" cy="191" r="3"/><circle cx="352" cy="209" r="3"/>
  </g>

  <!-- warm rolls -->
  <g fill="url(#warm)" filter="url(#glow)">
    <rect x="291" y="300" width="92" height="52" rx="25" transform="rotate(-8 291 300)"/>
    <rect x="278" y="334" width="94" height="52" rx="25" transform="rotate(10 278 334)"/>
    <rect x="317" y="320" width="78" height="50" rx="24" transform="rotate(-4 317 320)"/>
  </g>
  <g fill="none" stroke="#b937a9" stroke-width="5" stroke-linecap="round" opacity=".6">
    <path d="M313 327c22 4 37 11 49 24"/>
    <path d="M300 356c17 5 31 11 43 22"/>
  </g>

  <!-- chopsticks -->
  <rect x="103" y="236" width="306" height="13" rx="6.5" fill="url(#frame)" filter="url(#glow)"/>
  <rect x="103" y="254" width="306" height="13" rx="6.5" fill="url(#frame)" filter="url(#glow)"/>

  <!-- central clasp -->
  <rect x="232" y="216" width="48" height="72" rx="15" fill="#5547d8" stroke="#8d73ff" stroke-width="2" filter="url(#glow)"/>
  <path d="M246 252c8-11 16-14 23-14-3 9-10 16-20 20z" fill="#d9f7ff"/>
  <path d="M242 266c6-7 12-9 18-9-2 6-7 10-14 13z" fill="#b8fff0"/>

  <!-- inner highlights -->
  <rect x="86" y="96" width="340" height="320" rx="56" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
</svg>
